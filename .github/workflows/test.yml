# The kit had no CI at all until 2026-09-10 (hydra-hq task 099198): main unprotected, zero
# workflows, and 161 tests that ran only when a human remembered to type `npm test` — while
# hydra-hq's frontend pins this repo, so its code runs in HQ's console on Schyler's iPad.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci`, never `npm install`. #13 fixed a clean checkout's install (.npmrc
      # legacy-peer-deps, bisected to vitest 4's peer graph, plus the undeclared
      # @testing-library/dom peer) — so `npm install` DOES work here now. `npm ci` is still the
      # right CI verb: it does no resolution at all, so a runner's npm version cannot change what
      # gets installed, and it fails loudly when the lockfile and package.json disagree instead of
      # quietly reconciling them. Verified from this lockfile under npm 10.9.7 AND npm 11: 80
      # packages, 161/161, both.
      #
      # COUPLED TO #13's DELETE-WHEN: that .npmrc says to delete it once a plain
      # `rm -rf node_modules && npm install && npm test` succeeds without it. Delete the LOCKFILE
      # for that check too and regenerate it after — installing from a lockfile would satisfy the
      # test without proving resolution works, which is the thing being tested.
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      # A step that installed nothing would reach here and fail at `tsc: not found`, which is loud.
      # This is louder and earlier, and names the cause instead of a missing binary.
      - name: Refuse to test an empty tree
        run: |
          test -d node_modules && [ "$(ls -A node_modules | wc -l)" -gt 0 ] \
            || { echo "::error::node_modules is empty — the install reported success and did nothing"; exit 1; }

      # tsc --noEmit && vitest run. The grep is the point: vitest exits 0 on some paths that
      # collect no files, and a green check that ran zero tests is indistinguishable from a pass.
      # This repo shipped a test that could not fail earlier the same day; the lesson is cheap to encode.
      #
      # STRIP SGR FIRST — learned by this guard failing its own first CI run. vitest colourises on
      # the runner, so the summary line is literally `Tests \e[22m \e[1m\e[32m161 passed`, and a
      # regex expecting digits after the spaces fires on a PERFECT run. My local control had fed the
      # guard a hand-written clean string, which only proved the regex matched my idea of the output.
      # Both branches are now checked against the real bytes from that failed run.
      - name: Run the suite, and prove it ran
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' test-output.txt > test-output.plain
          grep -Eq 'Tests +[1-9][0-9]* passed' test-output.plain \
            || { echo "::error::the suite reported no passing tests — a green step that ran nothing"; exit 1; }

  # ---------------------------------------------------------------------------------------------
  # THE RELEASE RUNG. hydra-hq task e3a5de: this repo shipped merged-and-unreachable three releases
  # running (77a9dc, then kit#10, then kit#16 — a ruling Schyler personally answered a form to give
  # us, sitting untagged). The cause was NOT sloppiness: the version once rode WITH the feature in
  # one commit (5892e1f, v0.11.0), and splitting it out was correct, because five concurrent PRs
  # would all conflict on that one line. What the split did was trade a LOUD failure (a merge
  # conflict nobody can ignore) for a SILENT one (no tag, no complaint, every dashboard green).
  #
  # This restores the loudness. It does BOTH halves, and the second is the one that matters:
  #   * cut the tag when package.json names a version that has none;
  #   * FAIL when feat/fix commits have piled up since the last tag and nobody bumped — without
  #     which a feature merged with no bump produces no tag AND no complaint, i.e. today's silence
  #     with extra YAML. (merritt, gating: "or it's another instrument that can only pass".)
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declared even though this repo's default_workflow_permissions is already `write` (measured):
    # an account-level default is someone else's setting to flip, and a job that silently depends
    # on it fails at the push, after the merge, where nobody is looking.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags + full history: the check reads `<tag>..HEAD`

      - name: Tag this version, or say why the release is overdue
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null 2>&1; then
            # Released already. The question is whether anything RELEASABLE has landed since —
            # and that takes BOTH signals, per commit. Neither alone is right:
            #
            #   subject only (feat|fix)  false-positives on a fix that ships nothing. MEASURED:
            #                            b1ec829 `fix(deps)` touched .npmrc + package.json and NO
            #                            src/; `files: ["src"]` means no consumer could observe it,
            #                            so it would have held main red until someone cut an empty
            #                            release. (merritt, gating — the hole was his own commit.)
            #   src/ only                false-positives on a docstring. Five commits in this
            #                            repo's last fourteen touch src/ and are comment-only
            #                            (#12 #17 #18 #20 #21); #17 and #18 correctly cut nothing.
            #
            # So: a releasable commit is one whose SUBJECT says feat|fix AND whose TREE touches
            # src/. Per commit, not across the window — a `fix(deps)` sitting beside an unrelated
            # docs-that-touched-src/ would satisfy a global AND and fire wrongly (exactly the
            # v0.11.3..v0.11.4 window: b1ec829 + 1ca8b68).
            #
            # Replayed against real history with the conjunction in place — and NOTE THAT NO PR CAN
            # RUN THIS JOB (it is push-to-main only, by design), so a change here ships verified by
            # replay or not at all. To re-run it, extract the loop below and drive it over windows
            # with a known answer:
            #   v0.11.1..cb8330b  old 2 fires | new 2 fires   gaps 1+2, still caught
            #   v0.11.3..0efe003  old 2 fires | new 1 fires    gap 3, still caught
            #   v0.11.3..eca115b  old 2 fires | new 1 fires    docs push while gap 3 stood: still loud
            #   v0.11.3..b1ec829  old 1 FIRES | new 0 fires    <- the false positive, gone
            #   v0.11.4..main     old 0       | new 0          nothing releasable today
            # All three real gaps still found. And in the eca115b window the message now names ONE
            # commit instead of two, because `fix(deps)` is no longer counted as something to release.
            OVERDUE=$(git log --format='%H %s' "$TAG..HEAD" | while read -r sha subject; do
              case "$subject" in
                feat\(*|feat:*|feat!*|fix\(*|fix:*|fix!*) ;;
                *) continue ;;
              esac
              if git diff-tree --no-commit-id --name-only -r "$sha" -- src/ | grep -q .; then
                printf '  %s %s\n' "$(git rev-parse --short "$sha")" "$subject"
              fi
            done)
            if [ -n "$OVERDUE" ]; then
              echo "::error::feat/fix commits touching src/ landed since $TAG and package.json still says $VERSION — so no tag will be cut, and without this line nothing would have said so. Bump the version to release them:"
              printf '%s\n' "$OVERDUE"
              exit 1
            fi
            echo "$TAG is current and nothing releasable has landed since it."
            exit 0
          fi

          echo "package.json says $VERSION and no $TAG exists — cutting it."
          git config user.name  "hydra-bot-fleet[bot]"
          git config user.email "295638539+hydra-bot-fleet[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG — tagged on merge to main by the release rung (hydra-hq e3a5de)"
          git push origin "$TAG"
          echo "tagged $TAG at $(git rev-parse --short HEAD)"
